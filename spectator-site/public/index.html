<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Colonist AI's bots and links to their live 1v1 games on colonist.io." />
    <title>Colonist AI bots</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Colonist AI</h1>
        <p>Four bots playing 1v1 against people on colonist.io. Open a live game to watch.</p>
      </header>
      <section id="bots" class="bots" aria-live="polite">
        <p class="empty">Loading…</p>
      </section>
      <footer>
        <p>Watching opens the game on colonist.io. You need to be signed in there to spectate.</p>
        <p id="updated">&nbsp;</p>
      </footer>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
